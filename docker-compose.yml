services:

  mongodb:
    image: mongo:latest
    container_name: hotel-mongodb
    ports:
       - "27018:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - hotel-network

  user-service:
    build: ./user-service
    container_name: user-service
    ports:
      - "8081:8081"
    depends_on:
      - mongodb
    networks:
      - hotel-network

  hotel-service:
    build: ./hotel-service
    container_name: hotel-service
    ports:
      - "8082:8082"
    depends_on:
      - mongodb
    networks:
      - hotel-network

  reservation-service:
    build: ./reservation-service
    container_name: reservation-service
    ports:
      - "8083:8083"
    depends_on:
      - mongodb
    networks:
      - hotel-network

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - user-service
      - hotel-service
      - reservation-service
    networks:
      - hotel-network

  client:
    build: ./client
    container_name: hotel-client
    ports:
        - "3000:80"
    depends_on:
      - api-gateway
    networks:
      - hotel-network

volumes:
  mongo-data:

networks:
  hotel-network:
    driver: bridge